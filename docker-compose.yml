# ╔══════════════════════════════════════════════════════════════╗
# ║  fs0ciety — Docker Compose for Coolify                     ║
# ║  Services: Frontend, Backend, SurrealDB                    ║
# ║  ALL Traefik routing is managed by Coolify — NO labels.    ║
# ║                                                            ║
# ║  Subdomain setup (Coolify UI → frontend service):          ║
# ║    Domains field: fs0ciety.org,blog.fs0ciety.org,          ║
# ║                   dash.fs0ciety.org                        ║
# ║  Next.js middleware rewrites blog./dash. to /blog /dash.   ║
# ╚══════════════════════════════════════════════════════════════╝

services:
  # ── Frontend (Next.js 15) ─────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      - NEXT_PUBLIC_DOMAIN=${DOMAIN:-fs0ciety.org}
      - INTERNAL_API_URL=http://backend:3001
    expose:
      - "3000"
    depends_on:
      - backend
    restart: unless-stopped

  # ── Backend (Rust/Axum) ───────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=3001
      - RUST_LOG=info,fs0ciety_backend=debug
      - SURREAL_URL=ws://surrealdb:8000
      - SURREAL_NS=${SURREAL_NS:-fs0ciety}
      - SURREAL_DB=${SURREAL_DB:-main}
      - SURREAL_USER=${SURREAL_USER:-root}
      - SURREAL_PASS=${SURREAL_PASS:-changeme}
      - JWT_SECRET=${JWT_SECRET}
      - SONARR_URL=${SONARR_URL}
      - SONARR_API_KEY=${SONARR_API_KEY}
      - RADARR_URL=${RADARR_URL}
      - RADARR_API_KEY=${RADARR_API_KEY}
      - PLEX_URL=${PLEX_URL}
      - PLEX_TOKEN=${PLEX_TOKEN}
      - QBITTORRENT_URL=${QBITTORRENT_URL}
      - QBITTORRENT_USER=${QBITTORRENT_USER}
      - QBITTORRENT_PASS=${QBITTORRENT_PASS}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - PUBLIC_URL=${PUBLIC_URL:-https://fs0ciety.org}
    volumes:
      - uploads_data:/data/uploads
    expose:
      - "3001"
    depends_on:
      - surrealdb
    restart: unless-stopped

  # ── Database (SurrealDB) ──────────────────────────────────
  surrealdb:
    image: surrealdb/surrealdb:v2
    user: root
    command: start --user ${SURREAL_USER:-root} --pass ${SURREAL_PASS:-changeme} rocksdb:/data/srdb.db
    volumes:
      - surrealdb_data:/data
    restart: unless-stopped

volumes:
  surrealdb_data:
  uploads_data:
