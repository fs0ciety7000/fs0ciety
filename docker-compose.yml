# ╔══════════════════════════════════════════════════════════════╗
# ║  fs0ciety — Docker Compose for Coolify                     ║
# ║  Services: Frontend, Backend, SurrealDB, Tor               ║
# ║  ALL Traefik routing is managed by Coolify — NO labels.    ║
# ║                                                            ║
# ║  Subdomain setup (Coolify UI → per service):               ║
# ║    frontend: fs0ciety.org, blog.fs0ciety.org,              ║
# ║              dash.fs0ciety.org                              ║
# ║    surrealdb: db.fs0ciety.org                              ║
# ║  Next.js middleware rewrites blog./dash. to /blog /dash.   ║
# ║                                                            ║
# ║  Tor hidden service:                                       ║
# ║    .onion address in tor_data/hidden_service/hostname       ║
# ╚══════════════════════════════════════════════════════════════╝

services:
  # ── Frontend (Next.js 15) ─────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      - NEXT_PUBLIC_DOMAIN=${DOMAIN:-fs0ciety.org}
      - INTERNAL_API_URL=http://backend:3001
    expose:
      - "3000"
    depends_on:
      - backend
    restart: unless-stopped

  # ── Backend (Rust/Axum) ───────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=3001
      - RUST_LOG=info,fs0ciety_backend=debug
      - SURREAL_URL=ws://surrealdb:8000
      - SURREAL_NS=${SURREAL_NS:-fs0ciety}
      - SURREAL_DB=${SURREAL_DB:-main}
      - SURREAL_USER=${SURREAL_USER:-root}
      - SURREAL_PASS=${SURREAL_PASS:-changeme}
      - JWT_SECRET=${JWT_SECRET}
      - SONARR_URL=${SONARR_URL}
      - SONARR_API_KEY=${SONARR_API_KEY}
      - RADARR_URL=${RADARR_URL}
      - RADARR_API_KEY=${RADARR_API_KEY}
      - PLEX_URL=${PLEX_URL}
      - PLEX_TOKEN=${PLEX_TOKEN}
      - QBITTORRENT_URL=${QBITTORRENT_URL}
      - QBITTORRENT_USER=${QBITTORRENT_USER}
      - QBITTORRENT_PASS=${QBITTORRENT_PASS}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - PUBLIC_URL=${PUBLIC_URL:-https://fs0ciety.org}
      - ADMIN_API_KEY=${ADMIN_API_KEY}
      - PLEX_EXTERNAL_URL=${PLEX_EXTERNAL_URL}
      - SONARR_EXTERNAL_URL=${SONARR_EXTERNAL_URL}
      - RADARR_EXTERNAL_URL=${RADARR_EXTERNAL_URL}
      - QBITTORRENT_EXTERNAL_URL=${QBITTORRENT_EXTERNAL_URL}
    volumes:
      - uploads_data:/data/uploads
    expose:
      - "3001"
    depends_on:
      - surrealdb
    restart: unless-stopped

  # ── Database (SurrealDB) ──────────────────────────────────
  # Expose port 8000 so Coolify can route db.fs0ciety.org to it.
  # Configure in Coolify UI → surrealdb service → Domains: db.fs0ciety.org
  surrealdb:
    image: surrealdb/surrealdb:v2
    user: root
    command: start --user ${SURREAL_USER:-root} --pass ${SURREAL_PASS:-changeme} rocksdb:/data/srdb.db
    expose:
      - "8000"
    volumes:
      - surrealdb_data:/data
    restart: unless-stopped
    
    labels:
      - traefik.enable=true
      - traefik.http.routers.surrealdb.rule=Host(`db.fs0ciety.org`)
      - traefik.http.routers.surrealdb.entrypoints=https
      - traefik.http.routers.surrealdb.tls.certresolver=letsencrypt
      - traefik.http.services.surrealdb.loadbalancer.server.port=8000
    networks:
      - coolify

  # ── Tor Hidden Service ────────────────────────────────────
  # Runs a Tor daemon that exposes the frontend as a .onion site.
  # After first boot, find the address at:
  #   docker compose exec tor cat /var/lib/tor/hidden_service/hostname
  # The key is persisted in the tor_data volume — do NOT delete it
  # or you will lose your .onion address.
  tor:
    image: goldy/tor-hidden-service:latest
    environment:
      # service_name=container:port
      FRONTEND_TOR_SERVICE_HOSTS: "80:frontend:3000"
      FRONTEND_TOR_SERVICE_VERSION: "3"
    volumes:
      - tor_data:/var/lib/tor/hidden_service/
    depends_on:
      - frontend
    restart: unless-stopped

volumes:
  surrealdb_data:
  uploads_data:
  tor_data:
