# ╔══════════════════════════════════════════════════════════════╗
# ║  fs0ciety — Docker Compose for Coolify                     ║
# ║  Services: Frontend, Backend, SurrealDB                    ║
# ║  Traefik is managed by Coolify — no need to include it.    ║
# ╚══════════════════════════════════════════════════════════════╝
#
# Subdomains:
#   fs0ciety.org         → frontend  (terminal home)
#   blog.fs0ciety.org    → frontend  (/blog)
#   dash.fs0ciety.org    → frontend  (/dashboard)
#   api.fs0ciety.org     → backend   (or /api on any domain)

services:
  # ── Frontend (Next.js 15) ─────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      - NEXT_PUBLIC_API_URL=https://${DOMAIN}
      - NEXT_PUBLIC_WS_URL=wss://${DOMAIN}/ws
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`fs0ciety.org`) || Host(`blog.fs0ciety.org`) || Host(`dash.fs0ciety.org`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.frontend.loadbalancer.server.port=3000"
    depends_on:
      - backend
    restart: unless-stopped

  # ── Backend (Rust/Axum) ───────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=3001
      - RUST_LOG=info,fs0ciety_backend=debug
      - SURREAL_URL=ws://surrealdb:8000
      - SURREAL_NS=${SURREAL_NS:-fs0ciety}
      - SURREAL_DB=${SURREAL_DB:-main}
      - SURREAL_USER=${SURREAL_USER:-root}
      - SURREAL_PASS=${SURREAL_PASS:-changeme}
      - JWT_SECRET=${JWT_SECRET}
      - SONARR_URL=${SONARR_URL}
      - SONARR_API_KEY=${SONARR_API_KEY}
      - RADARR_URL=${RADARR_URL}
      - RADARR_API_KEY=${RADARR_API_KEY}
      - PLEX_URL=${PLEX_URL}
      - PLEX_TOKEN=${PLEX_TOKEN}
      - QBITTORRENT_URL=${QBITTORRENT_URL}
      - QBITTORRENT_USER=${QBITTORRENT_USER}
      - QBITTORRENT_PASS=${QBITTORRENT_PASS}
    expose:
      - "3001"
    depends_on:
      surrealdb:
        condition: service_healthy
    restart: unless-stopped

  # ── Database (SurrealDB) ──────────────────────────────────
  surrealdb:
    image: surrealdb/surrealdb:v2
    command: start --user ${SURREAL_USER:-root} --pass ${SURREAL_PASS:-changeme} rocksdb:/data/srdb.db
    volumes:
      - surrealdb_data:/data
    healthcheck:
      test: ["CMD", "/surreal", "is-ready", "--conn", "http://localhost:8000"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  surrealdb_data:
