name: Publish Blog Posts

on:
  push:
    branches: [main]
    paths:
      - 'content/posts/**'
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait for deployment
        run: |
          # Give Coolify time to redeploy containers so the API is up.
          echo "Waiting 120s for Coolify deployment to finish..."
          sleep 120

      - name: Publish changed MDX files
        env:
          FS0CIETY_API_KEY: ${{ secrets.FS0CIETY_API_KEY }}
          FS0CIETY_URL: https://fs0ciety.org
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          CHANGED=""

          # For push events, diff against the previous commit SHA provided by GitHub.
          if [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            CHANGED=$(git diff --name-only "$BEFORE_SHA" HEAD -- 'content/posts/*.mdx' 2>/dev/null || true)
          fi

          # For workflow_dispatch or if diff failed, publish all MDX files.
          if [ -z "$CHANGED" ]; then
            echo "No diff available — publishing all MDX files..."
            CHANGED=$(find content/posts -name '*.mdx' ! -name '_template.mdx' 2>/dev/null || true)
          fi

          if [ -z "$CHANGED" ]; then
            echo "No MDX files to publish."
            exit 0
          fi

          FAIL=0
          for file in $CHANGED; do
            if [ -f "$file" ]; then
              echo "Publishing: $file"
              ./scripts/publish.sh "$file" || FAIL=1
            fi
          done

          if [ "$FAIL" -eq 1 ]; then
            echo "::error::One or more posts failed to publish"
            exit 1
          fi
