# ╔══════════════════════════════════════════════════════════════╗
# ║  fs0ciety — Docker Compose for Coolify                     ║
# ║  Services: Frontend, Backend, SurrealDB                    ║
# ║  Coolify manages the main domain router (fs0ciety.org).    ║
# ║  Subdomain routers are added here with unique names so     ║
# ║  they don't conflict with Coolify's auto-generated config. ║
# ╚══════════════════════════════════════════════════════════════╝
#
# Domains:
#   fs0ciety.org         → frontend  (Coolify manages this)
#   blog.fs0ciety.org    → frontend  (/blog — via Next.js middleware)
#   dash.fs0ciety.org    → frontend  (/dashboard — via Next.js middleware)
#   api.fs0ciety.org     → backend   (Coolify manages this)

services:
  # ── Frontend (Next.js 15) ─────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      - NEXT_PUBLIC_DOMAIN=${DOMAIN:-fs0ciety.org}
      - INTERNAL_API_URL=http://backend:3001
    expose:
      - "3000"
    labels:
      # Subdomain routers — unique names to avoid Coolify conflicts
      - "traefik.http.routers.fs0ciety-blog.rule=Host(`blog.${DOMAIN:-fs0ciety.org}`)"
      - "traefik.http.routers.fs0ciety-blog.entrypoints=https"
      - "traefik.http.routers.fs0ciety-blog.tls=true"
      - "traefik.http.routers.fs0ciety-blog.tls.certresolver=letsencrypt"
      - "traefik.http.routers.fs0ciety-blog.service=fs0ciety-blog-svc"
      - "traefik.http.services.fs0ciety-blog-svc.loadbalancer.server.port=3000"
      - "traefik.http.routers.fs0ciety-dash.rule=Host(`dash.${DOMAIN:-fs0ciety.org}`)"
      - "traefik.http.routers.fs0ciety-dash.entrypoints=https"
      - "traefik.http.routers.fs0ciety-dash.tls=true"
      - "traefik.http.routers.fs0ciety-dash.tls.certresolver=letsencrypt"
      - "traefik.http.routers.fs0ciety-dash.service=fs0ciety-dash-svc"
      - "traefik.http.services.fs0ciety-dash-svc.loadbalancer.server.port=3000"
    depends_on:
      - backend
    restart: unless-stopped

  # ── Backend (Rust/Axum) ───────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=3001
      - RUST_LOG=info,fs0ciety_backend=debug
      - SURREAL_URL=ws://surrealdb:8000
      - SURREAL_NS=${SURREAL_NS:-fs0ciety}
      - SURREAL_DB=${SURREAL_DB:-main}
      - SURREAL_USER=${SURREAL_USER:-root}
      - SURREAL_PASS=${SURREAL_PASS:-changeme}
      - JWT_SECRET=${JWT_SECRET}
      - SONARR_URL=${SONARR_URL}
      - SONARR_API_KEY=${SONARR_API_KEY}
      - RADARR_URL=${RADARR_URL}
      - RADARR_API_KEY=${RADARR_API_KEY}
      - PLEX_URL=${PLEX_URL}
      - PLEX_TOKEN=${PLEX_TOKEN}
      - QBITTORRENT_URL=${QBITTORRENT_URL}
      - QBITTORRENT_USER=${QBITTORRENT_USER}
      - QBITTORRENT_PASS=${QBITTORRENT_PASS}
    expose:
      - "3001"
    depends_on:
      - surrealdb
    restart: unless-stopped

  # ── Database (SurrealDB) ──────────────────────────────────
  surrealdb:
    image: surrealdb/surrealdb:v2
    user: root
    command: start --user ${SURREAL_USER:-root} --pass ${SURREAL_PASS:-changeme} rocksdb:/data/srdb.db
    volumes:
      - surrealdb_data:/data
    restart: unless-stopped

volumes:
  surrealdb_data:
